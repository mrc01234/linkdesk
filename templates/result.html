{{define "result"}}
<section class="result-heading"><span class="badge active">创建成功</span><h1>链接已准备好分享。</h1><p class="muted">复制短链接，或下载二维码发送给对方。</p></section>
<section class="card result-card"><div class="result-detail"><label for="shortUrl">短链接</label>
<div class="copy-row"><input id="shortUrl" value="{{.shortURL}}" readonly><button class="btn" type="button" data-copy="{{.shortURL}}">复制</button></div>
<label>目标网址</label><p class="break-word"><a href="{{.url.LongURL}}" target="_blank" rel="noopener noreferrer">{{.url.LongURL}}</a></p>
<label>有效期</label><p>{{if .url.ExpiresAt}}{{formatTime .url.ExpiresAt}}{{else}}长期有效{{end}}</p>
<div class="result-actions"><a class="btn btn-secondary" href="/urls">查看链接管理</a><a class="text-link" href="/">继续创建 →</a></div>
</div><div class="qr-panel"><img src="/qr/{{.url.ShortCode}}" alt="此短链接的二维码" width="192" height="192"><a class="text-link" href="/qr/{{.url.ShortCode}}" download="linkdesk-{{.url.ShortCode}}.png">下载二维码 ↓</a></div></section>
{{end}}
